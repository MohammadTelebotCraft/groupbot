[package]
name = "groupbot"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Build the optional CUDA execution-provider hooks. The runtime itself is supplied through
# ORT_LIBRARY_PATH on a GPU worker; CPU-only builds keep using the embedded runtime unchanged.
cuda = ["ort/cuda"]

[dependencies]
grammers-client = { path = "../grammers/grammers-client", features = ["html", "parse_invite_link"] }
grammers-session = { path = "../grammers/grammers-session", features = ["sqlite-storage"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8"
sha2 = "0.10"
hmac = "0.12"
tower = { version = "0.5", default-features = false, features = ["limit"] }
log = "0.4"
simple_logger = { version = "5", default-features = false, features = ["colors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
cosmic-text = "0.19.0"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
base64 = "0.22"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.23"
