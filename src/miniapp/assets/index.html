<link rel="stylesheet" href="/app.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // The theme before the first paint, by the rule app.js's applyTheme keeps after it, so a
  // light client never flashes the dark default while app.js downloads.
  (function () {
    try {
      var pref = localStorage.getItem("gm.theme");
      var w = window.Telegram && window.Telegram.WebApp;
      document.documentElement.dataset.theme = pref === "dark" || pref === "light" ? pref
        : w && w.initData && w.colorScheme ? w.colorScheme
        : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    } catch (e) {}
  })();
</script>
</head>

<div id="app">
  <div id="loading" class="boot" role="status" aria-label="در حال بارگذاری"><span class="boot-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4.2 8-11V5.2l-8-3-8 3V11c0 6.8 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg></span></div>
</div>
